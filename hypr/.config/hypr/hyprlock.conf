# hyprlock: Neon Rain, restrained dark violet.
# Launched only through ~/.config/hypr/scripts/lock.sh (hypridle + SUPER+L).
# Palette matches swaync/style.css: text rgb(226,220,245), accent rgb(140,92,246).
# Clear password buffer: ESC, Ctrl+U, Ctrl+Backspace.

$font = 0xProto Nerd Font
$text = rgba(226, 220, 245, 1.0)
$muted = rgba(176, 164, 214, 0.85)
$accent = rgba(140, 92, 246, 0.9)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 4, linear
    animation = fadeOut, 1, 4, linear
    animation = inputFieldDots, 1, 2, linear
}

# Current static wallpaper (hyprpaper), blurred and darkened so text stays readable.
background {
    monitor =
    path = /home/YolkFinggers/wallpaper/active/illustration-rain-futuristic-city.jpg
    color = rgba(14, 10, 24, 1.0)   # fallback if the image is missing
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.12
}

# Clock
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(8, 4, 16, 0.6)
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $muted
    font_size = 20
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(8, 4, 16, 0.6)
    position = 0, 70
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    rounding = 10

    inner_color = rgba(16, 11, 28, 0.82)
    outer_color = $accent
    font_color = $text
    check_color = rgba(110, 168, 255, 0.9)
    fail_color = rgba(236, 72, 128, 0.9)
    capslock_color = rgba(240, 190, 90, 0.9)

    font_family = $font
    placeholder_text = Password
    fail_text = $FAIL ($ATTEMPTS)
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(140, 92, 246, 0.18)

    position = 0, -40
    halign = center
    valign = center
}
