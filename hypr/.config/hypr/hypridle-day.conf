# hypridle daytime profile, selected by scripts/hypridle-schedule during [08:00,17:30) local time.
# No automatic lock and no DPMS off. Manual SUPER+L and `loginctl lock-session` still lock via lock_cmd.
# Outside that window the normal hypridle.conf (lock 300s, DPMS off 600s) is used.

general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh   # also used by `loginctl lock-session`
}

# Enter City Mode after 3 minutes idle, but never toggle an already-open city closed.
# No on-resume dismissal: City Mode stays interactive until Esc / SUPER+S.
listener {
    timeout = 180
    on-timeout = if ! pidof hyprlock >/dev/null 2>&1 && ~/.dotfiles/neon-rain/scripts/neon-rain-proto ipc cityState | jq -e '.open == false' >/dev/null; then ~/.dotfiles/neon-rain/scripts/city-ctl toggle; fi
}

# Rescue only: if the 08:00 switch restarted hypridle while displays were already off,
# the old daemon's on-resume never runs. This turns displays back on at the next user
# input after 30s idle. It never turns displays off and never locks.
listener {
    timeout = 30
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
