# hypridle: always-on host (Telegram gateway). Lock at 5 min, displays off at 10 min.
# Never suspends, hibernates or logs out; power/lid policy is left to logind defaults.
# Started by the hyprland.start hook in hyprland.lua via the packaged hypridle.service.
#
# DPMS uses the Hyprland 0.56 Lua dispatcher: `hyprctl dispatch` wraps its argument in
# hl.dispatch(...). The action must be spelled "off"/"on"; anything else falls back to toggle.

general {
    lock_cmd = ~/.config/hypr/scripts/lock.sh   # also used by `loginctl lock-session`
}

listener {
    timeout = 300                                # 5 min
    on-timeout = ~/.config/hypr/scripts/lock.sh
}

listener {
    timeout = 600                                # 10 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
