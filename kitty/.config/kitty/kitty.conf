include Royal.conf

# BEGIN_KITTY_FONTS
font_family      family="ProggyClean Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

font_size 12

# Color Scheme
dynamic_background_opacity yes

# Keymaps
map super+ctrl+c launch --cwd=current --type=os-window
